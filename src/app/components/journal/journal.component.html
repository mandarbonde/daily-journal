<div class="journal-page">
  <div class="journal-container">
    <header class="journal-header">
      <a routerLink="/entries" class="back-link">← All Entries</a>
      <h1>{{ editMode ? 'Edit Entry' : 'New Entry' }}</h1>
      <span class="date-badge">{{ entryDate | date:'dd MMM yyyy' }}</span>
    </header>

    <form [formGroup]="form" (ngSubmit)="onSave()" class="journal-form">
      <div class="form-group">
        <label for="entry-date-display">Date</label>
        <div class="date-picker">
          <input
            id="entry-date-display"
            class="date-picker__display"
            type="text"
            [value]="entryDate | date:'dd MMM yyyy'"
            [class.invalid]="form.get('date')?.invalid && form.get('date')?.touched"
            readonly
          />
          <button type="button" class="date-picker__button" (click)="openDatePicker()">Choose date</button>
          <input #datePicker type="date" formControlName="date" class="date-picker__native" tabindex="-1" aria-hidden="true" />
        </div>
      </div>

      <div class="form-group">
        <label>Mood</label>
        <div class="mood-picker">
          <button
            *ngFor="let mood of moods"
            type="button"
            [class.selected]="selectedMood === mood.value"
            [class.invalid]="form.get('mood')?.invalid && form.get('mood')?.touched"
            (click)="selectMood(mood.value)"
            [attr.aria-pressed]="selectedMood === mood.value"
          >
            <span class="mood-emoji">{{ mood.emoji }}</span>
            <span class="mood-label">{{ mood.label }}</span>
          </button>
        </div>
        <div *ngIf="form.get('mood')?.invalid && form.get('mood')?.touched" class="error-msg">
          Please select a mood.
        </div>
      </div>

      <div class="form-group">
        <label for="entry-description">How was your day?</label>
        <textarea
          id="entry-description"
          formControlName="description"
          rows="6"
          placeholder="Write about your day..."
          [class.invalid]="form.get('description')?.invalid && form.get('description')?.touched"
        ></textarea>
        <div *ngIf="form.get('description')?.invalid && form.get('description')?.touched" class="error-msg">
          Please write something about your day.
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-outline" (click)="goToEntries()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
          {{ editMode ? 'Update Entry' : 'Save Entry' }}
        </button>
      </div>
      <div class="form-feedback">
        <div *ngIf="saveError" class="error-msg" role="alert">{{ saveError }}</div>
        <div *ngIf="saveSuccess" class="success-msg" role="status">{{ saveSuccess }}</div>
      </div>
    </form>
  </div>
</div>
